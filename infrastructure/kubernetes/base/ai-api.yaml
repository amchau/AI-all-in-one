apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-api
  namespace: ai-platform
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ai-api
  template:
    metadata:
      labels:
        app: ai-api
    spec:
      automountServiceAccountToken: false
      containers:
        - name: ai-api
          image: localhost/ai-api:stage3.11
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          env:
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: http://otel-collector.ai-platform.svc.cluster.local:4318/v1/traces
            - name: LITELLM_URL
              value: http://litellm.ai-platform.svc.cluster.local:4000
            - name: LITELLM_MODEL
              value: gpt-oss-20b
            - name: SPARSE_MODEL
              value: Qdrant/bm25
            - name: RERANKER_URL
              value: http://reranker.ai-platform.svc.cluster.local:8080
            - name: RERANKER_MODEL
              value: BAAI/bge-reranker-base
            - name: LITELLM_MASTER_KEY
              valueFrom:
                secretKeyRef:
                  name: stage1-secrets
                  key: LITELLM_MASTER_KEY
            - name: POSTGRES_HOST
              value: postgres.ai-platform.svc.cluster.local
            - name: POSTGRES_PORT
              value: "5432"
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  name: stage1-secrets
                  key: POSTGRES_DB
            - name: POSTGRES_QUERY_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: rag-query-secrets
                  key: POSTGRES_PASSWORD
            - name: QDRANT_URL
              value: http://qdrant.ai-platform.svc.cluster.local:6333
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 10001
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8000
            initialDelaySeconds: 8
            periodSeconds: 5
            timeoutSeconds: 10
          livenessProbe:
            httpGet:
              path: /livez
              port: 8000
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 2
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: ai-api
  namespace: ai-platform
spec:
  selector:
    app: ai-api
  ports:
    - name: http
      port: 8000
      targetPort: 8000
