apiVersion: batch/v1
kind: Job
metadata:
  name: rag-ingest
  namespace: ai-platform
spec:
  suspend: true
  backoffLimit: 2
  activeDeadlineSeconds: 1800
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app: rag-ingest
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: rag-ingest
          image: localhost/ai-api:stage2
          imagePullPolicy: IfNotPresent
          command: ["python", "-m", "rag.ingestion"]
          env:
            - name: INGESTION_INPUT_DIR
              value: /app/data/generated
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: http://otel-collector.ai-platform.svc.cluster.local:4318/v1/traces
            - name: LITELLM_URL
              value: http://litellm.ai-platform.svc.cluster.local:4000
            - name: LITELLM_EMBEDDING_MODEL
              value: embed-small
            - name: SPARSE_MODEL
              value: Qdrant/bm25
            - name: LITELLM_MASTER_KEY
              valueFrom:
                secretKeyRef:
                  name: stage1-secrets
                  key: LITELLM_MASTER_KEY
            - name: POSTGRES_HOST
              value: postgres.ai-platform.svc.cluster.local
            - name: POSTGRES_PORT
              value: "5432"
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  name: stage1-secrets
                  key: POSTGRES_DB
            - name: POSTGRES_USER
              value: rag_ingest
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: rag-ingest-secrets
                  key: POSTGRES_PASSWORD
            - name: QDRANT_URL
              value: http://qdrant.ai-platform.svc.cluster.local:6333
            - name: MINIO_ENDPOINT
              value: minio.ai-platform.svc.cluster.local:9000
            - name: MINIO_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: stage1-secrets
                  key: MINIO_ACCESS_KEY
            - name: MINIO_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: stage1-secrets
                  key: MINIO_SECRET_KEY
            - name: MINIO_SECURE
              value: "false"
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 10001
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}