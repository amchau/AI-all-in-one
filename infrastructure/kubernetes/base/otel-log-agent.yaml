apiVersion: v1
kind: ConfigMap
metadata:
  name: otel-log-agent-config
  namespace: ai-platform
data:
  otel-collector.yaml: |
    extensions:
      health_check:
        endpoint: 0.0.0.0:13133

    receivers:
      file_log:
        include:
          - /var/log/pods/ai-platform_ai-api-*/*/*.log
          - /var/log/pods/ai-platform_claims-service-*/*/*.log
          - /var/log/pods/ai-platform_claims-risk-service-*/*/*.log
        start_at: end
        include_file_path: true
        operators:
          - type: container

    processors:
      batch: {}
      resource/log_source:
        attributes:
          - action: upsert
            key: service.name
            value: kubernetes-container-logs

    exporters:
      otlp_grpc:
        endpoint: otel-collector.ai-platform.svc.cluster.local:4317
        tls:
          insecure: true

    service:
      extensions: [health_check]
      pipelines:
        logs:
          receivers: [file_log]
          processors: [resource/log_source, batch]
          exporters: [otlp_grpc]
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: otel-log-agent
  namespace: ai-platform
spec:
  selector:
    matchLabels:
      app: otel-log-agent
  template:
    metadata:
      labels:
        app: otel-log-agent
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        supplementalGroups: [0]
      containers:
        - name: otel-collector
          image: otel/opentelemetry-collector-contrib:0.162.0
          imagePullPolicy: IfNotPresent
          args: ["--config=/etc/otelcol/otel-collector.yaml"]
          ports:
            - name: health
              containerPort: 13133
          resources:
            requests:
              cpu: 75m
              memory: 128Mi
            limits:
              cpu: 300m
              memory: 384Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: config
              mountPath: /etc/otelcol/otel-collector.yaml
              subPath: otel-collector.yaml
              readOnly: true
            - name: pod-logs
              mountPath: /var/log/pods
              readOnly: true
            - name: tmp
              mountPath: /tmp
          readinessProbe:
            httpGet:
              path: /
              port: health
            initialDelaySeconds: 5
            periodSeconds: 10
      volumes:
        - name: config
          configMap:
            name: otel-log-agent-config
        - name: pod-logs
          hostPath:
            path: /var/log/pods
            type: Directory
        - name: tmp
          emptyDir: {}