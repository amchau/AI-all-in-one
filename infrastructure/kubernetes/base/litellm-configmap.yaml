apiVersion: v1
kind: ConfigMap
metadata:
  name: litellm-config
  namespace: ai-platform
data:
  config.yaml: |
    model_list:
      - model_name: gpt-oss-20b
        litellm_params:
          model: groq/openai/gpt-oss-20b
          api_key: os.environ/GROQ_API_KEY

    general_settings:
      master_key: os.environ/LITELLM_MASTER_KEY
