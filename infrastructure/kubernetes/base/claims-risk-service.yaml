apiVersion: apps/v1
kind: Deployment
metadata:
  name: claims-risk-service
  namespace: ai-platform
spec:
  replicas: 1
  selector:
    matchLabels:
      app: claims-risk-service
  template:
    metadata:
      labels:
        app: claims-risk-service
    spec:
      automountServiceAccountToken: false
      containers:
        - name: claims-risk-service
          image: localhost/claims-risk-service:stage5.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: http://otel-collector:4318/v1/traces
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 768Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 10001
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /livez
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
---
apiVersion: v1
kind: Service
metadata:
  name: claims-risk-service
  namespace: ai-platform
spec:
  type: ClusterIP
  selector:
    app: claims-risk-service
  ports:
    - name: http
      port: 8080
      targetPort: http
