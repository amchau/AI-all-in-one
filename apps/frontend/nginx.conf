server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header X-Frame-Options DENY always;
    add_header Content-Security-Policy "default-src 'self'; connect-src 'self'; font-src 'self'; img-src 'self' data:; style-src 'self'; script-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location = /api/v1/claims/hybrid-investigations {
        access_log off;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        set $args "";
        proxy_pass http://ai-api.ai-platform.svc.cluster.local:8000/v1/claims/hybrid-investigations;
    }

    location = /api/v1/claims/workflows {
        access_log off;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        set $args "";
        proxy_pass http://ai-api.ai-platform.svc.cluster.local:8000/v1/claims/workflows;
    }

    location ~ "^/api/v1/claims/workflows/[0-9a-fA-F-]{36}(/(dispositions|resume))?$" {
        access_log off;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        set $args "";
        rewrite ^/api(/.*)$ $1 break;
        proxy_pass http://ai-api.ai-platform.svc.cluster.local:8000;
    }

    location = /api {
        access_log off;
        return 404;
    }

    location /api/ {
        access_log off;
        return 404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}